org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Driver app build switches (override with -P or ~/.gradle/gradle.properties; never put credentials here).
# Debug builds use driver.devApiBaseUrl; release builds use driver.prodApiBaseUrl (default https://dynamicone.ai/api/driver/v1/).
# Emulator/USB device: run `adb reverse tcp:7167 tcp:7167` so https://localhost:7167 reaches the dev PC.
driver.devApiBaseUrl=https://localhost:7167/api/driver/v1/
# true = in-app demo backend (debug builds only, clearly marked DEMO). Release ignores this switch.
driver.demoMode=false
# true = sign-in, modules and office attendance through the DynamicONE Mobile API (/api/mobile/v1/, docs/15_MOBILE_APP_API.md).
# Keep false until the backend serves it; drivers then sign in through the Driver API.
app.mobileApi=false
