org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Driver app build switches (override with -P or ~/.gradle/gradle.properties; never put credentials here).
# Debug builds use driver.devApiBaseUrl; release builds use driver.prodApiBaseUrl (default https://dynamicone.ai/api/driver/v1/).
# Emulator/USB device: run `adb reverse tcp:7167 tcp:7167` so https://localhost:7167 reaches the dev PC.
driver.devApiBaseUrl=https://localhost:7167/api/driver/v1/
# true = in-app demo backend (debug builds only, clearly marked DEMO). Release ignores this switch.
driver.demoMode=false
# true = sign-in, modules and office attendance through the DynamicONE Mobile API (/api/mobile/v1/, docs/15_MOBILE_APP_API.md).
# Default since 30.09.2026 (user decision): every account, drivers too, signs in here and gets its server modules.
# false = old path: drivers sign in through the Driver API with the driver module only (no personnel files).
app.mobileApi=true
# true = driver daily shift: tachograph rest card, wake-up alarm, NFC vehicle tag and daily vehicle check
# (docs/16_DRIVER_SHIFT_REST_AND_VEHICLE_CHECK.md). Keep false until the backend serves those Driver API endpoints.
app.driverShift=false
# true = device management and remote screen sessions (docs/29_DEVICE_MANAGEMENT.md): the app can be enrolled as a
# managed company device (device owner), checks in with the office and offers the remote session. false = nothing of
# it is scheduled or shown. Never active in the demo.
app.deviceManagement=true
